seed: 42

paths:
  train: data/train.csv
  test: data/test.csv
  clients: data/clientes.csv
  sample_submission: data/sample_submission.csv
  models_dir: models
  outputs_dir: outputs

targets:
  classification: repeat_purchase_90d
  regression: spend_next_90d

id_cols:
  - ID
  - customer_id

# Columns never used as model inputs (purchase_date is used only to order the splits).
# Everything else is a candidate; feature_selection below decides, inside each fold.
drop_columns:
  - purchase_date

# Columns taken from clientes.csv (joined on customer_id).
client_columns:
  - country_or_region
  - commercial_region
  - customer_since_year

validation:
  date_col: purchase_date
  holdout_fraction: 0.2 # most recent rows, never used for any choice
  n_splits: 5 # time-ordered folds on the remaining rows
  gap_days: 90 # training rows end this many days before validation/hold-out rows start (the target's 90-day window)

preprocessing:
  # Each choice accepts a name, or {type: name, params: {...}} for sklearn parameters.
  scaler: robust # none | standard | minmax | robust | maxabs | normalize | power | quantile
  numeric_imputer: mean # median | mean | most_frequent | constant (0) | knn | none
  categorical_imputer: constant # constant ("missing") | most_frequent | none
  encoder: ordinal # onehot | ordinal (unseen categories -> -1)
  # Examples (replace the corresponding choice above):
  # scaler: {type: robust, params: {quantile_range: [10, 90]}}
  # numeric_imputer: {type: knn, params: {n_neighbors: 5, add_indicator: false}}
  # categorical_imputer: {type: constant, params: {fill_value: unknown}}
  # encoder: {type: onehot, params: {max_categories: 30}}
  min_frequency: 20 # category levels with fewer training rows are grouped together
  categorical_features: # every other feature is treated as numeric
    - payment_type
    - salesperson
    - commercial_zone
    - transport_method
    - warehouse
    - document_series
    - country_or_region
    - commercial_region

# Feature selection: the first pipeline step, fitted on each fold's training rows only (src/selection.py).
# method: permutation | none. Raw columns are ranked by permutation importance through a probe (preprocessing +
# random forest with `params`) over `n_splits` inner folds x `n_repeats` shuffles. Dropped: importance not above
# max(`reference`, `min_importance`), or a weaker member of a numeric family with Spearman |r| >= corr_threshold.
# random_noise must stay a candidate (not in drop_columns): it is the reference.
# Cached in outputs/cache; delete that folder after editing src/selection.py or src/preprocessing.py.
feature_selection:
  method: permutation
  n_splits: 5
  n_repeats: 2
  corr_threshold: 0.9
  reference: random_noise
  min_importance:         # smallest score drop a feature must cause when shuffled; raise it to keep fewer features
    classification: 0     # in ROC-AUC (useful features: about 0.001-0.007), e.g. 0.0005
    regression: 5         # in EUR of RMSE (useful features: about 1-300), e.g. 5
  params: { n_estimators: 100, min_samples_leaf: 5, n_jobs: -1 }

preprocessing_experiment:
  # Grid search: test all combinations of the candidate lists below.
  # The current preprocessing is always included as a reference.
  candidates:
    scaler: [none, standard, robust]
    numeric_imputer: [median, mean]
    categorical_imputer: [constant, most_frequent]
    encoder: [onehot, ordinal]
  # Candidates may also use {type: name, params: {...}}, just like preprocessing.
  # 24 combinations x 5 folds = 120 fits per model. Extend these lists as needed.

classification:
  metrics: [f1, precision, recall, accuracy, roc_auc]
  selection_metric: f1  # the Kaggle metric; must be one of metrics
  threshold: 0.5        # probability from which a customer is predicted to return
  model: random_forest  # the one that `train` saves; must be a name in models
  models:               # every model that `compare` cross-validates, with its params
    logistic_regression: { params: { max_iter: 2000 } }
    random_forest: { params: { n_estimators: 300, min_samples_leaf: 5 } }
    hist_gradient_boosting: { params: { learning_rate: 0.05, max_iter: 200 } }
    xgboost:
      { params: { n_estimators: 200, learning_rate: 0.05, max_depth: 4 } }
    lightgbm:
      {
        params:
          {
            n_estimators: 200,
            learning_rate: 0.05,
            num_leaves: 15,
            verbose: -1,
          },
      }
    catboost:
      {
        params:
          {
            iterations: 300,
            learning_rate: 0.05,
            depth: 6,
            verbose: 0,
            allow_writing_files: false,
          },
      }

regression:
  metrics: [rmse, mae, r2]    # measured in EUR, on customers who really returned
  selection_metric: rmse      # lower is better; must be one of metrics
  model: random_forest        # the one that `train` saves; must be a name in models
  # log_target: true = fit on log(1 + spend) and convert predictions back to EUR. Off everywhere:
  # with ridge a few predictions explode once converted back; with the tree models it lowers MAE
  # (about 1,300 against 1,400 EUR) but raises RMSE, the selection metric.
  models: # every model that `compare` cross-validates, with its params
    ridge: { params: { alpha: 1.0 }, log_target: false }
    random_forest:
      { params: { n_estimators: 300, min_samples_leaf: 5 }, log_target: false }
    hist_gradient_boosting:
      { params: { learning_rate: 0.05, max_iter: 200 }, log_target: false }
    xgboost:
      {
        params: { n_estimators: 200, learning_rate: 0.05, max_depth: 4 },
        log_target: false,
      }
    lightgbm:
      {
        params:
          {
            n_estimators: 200,
            learning_rate: 0.05,
            num_leaves: 15,
            verbose: -1,
          },
        log_target: false,
      }
    catboost:
      {
        params:
          {
            iterations: 300,
            learning_rate: 0.05,
            depth: 6,
            verbose: 0,
            allow_writing_files: false,
          },
        log_target: false,
      }

outputs:
  submission: outputs/submission.csv
  regression_predictions: outputs/regression_predictions.csv
  scoreboard: outputs/runs.csv
